<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-label="Voice, typing and browser agents all drive one set of tools" font-size="13" font-family="Inter Tight, system-ui, sans-serif"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a93a8"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#141a33">Voice, typing and browser agents all drive one set of tools</text><g fill="none" stroke="#8a93a8" stroke-width="1.25"><path d="M132 96V128" marker-end="url(#arch-arrow)"></path><path d="M380 96V128" marker-end="url(#arch-arrow)"></path><path d="M628 96V128" marker-end="url(#arch-arrow)"></path><path d="M132 200V240" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M380 200V240" marker-end="url(#arch-arrow)"></path><path d="M628 200V240" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M380 296V336" marker-end="url(#arch-arrow)"></path><path d="M380 392V432" marker-end="url(#arch-arrow)"></path></g><g><rect x="24" y="56" width="216" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="132" y="81" text-anchor="middle" fill="#141a33">Shopper talks</text></g><g><rect x="272" y="56" width="216" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="380" y="81" text-anchor="middle" fill="#141a33">Shopper types</text></g><g><rect x="520" y="56" width="216" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="628" y="81" text-anchor="middle" fill="#141a33">Browser agent</text></g><g><rect x="24" y="128" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="132" y="152" text-anchor="middle" font-weight="600" fill="#141a33">Gemini Live</text><text x="132" y="168" text-anchor="middle" font-size="11.5" fill="#4d5270">Mic in as 16 kHz PCM</text><text x="132" y="184" text-anchor="middle" font-size="11.5" fill="#4d5270">Spoken reply out at 24 kHz</text></g><g><rect x="272" y="128" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="380" y="152" text-anchor="middle" font-weight="600" fill="#141a33">Local parser</text><text x="380" y="168" text-anchor="middle" font-size="11.5" fill="#4d5270">Keyword rules</text><text x="380" y="184" text-anchor="middle" font-size="11.5" fill="#4d5270">Works with no API key</text></g><g><rect x="520" y="128" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="628" y="152" text-anchor="middle" font-weight="600" fill="#141a33">WebMCP</text><text x="628" y="168" text-anchor="middle" font-size="11.5" fill="#4d5270">navigator.modelContext</text><text x="628" y="184" text-anchor="middle" font-size="11.5" fill="#4d5270">Same tools for agents</text></g><text x="142" y="224" font-size="11.5" fill="#4d5270">tool calls and results</text><g><rect x="24" y="240" width="712" height="56" rx="8" fill="#b5401b" fill-opacity="0.12" stroke="#b5401b" stroke-width="2"></rect><text x="380" y="264" text-anchor="middle" font-weight="600" fill="#141a33">One tool registry: 9 tools</text><text x="380" y="280" text-anchor="middle" font-size="11.5" fill="#141a33">search, refine, next and previous page, layout, open, close, save, facets</text></g><g><rect x="160" y="336" width="440" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="380" y="360" text-anchor="middle" font-weight="600" fill="#141a33">Rail state</text><text x="380" y="376" text-anchor="middle" font-size="11.5" fill="#4d5270">Filters, sort, page and saved list over 120 jackets</text></g><g><rect x="160" y="432" width="440" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="380" y="456" text-anchor="middle" font-weight="600" fill="#141a33">Screen</text><text x="380" y="472" text-anchor="middle" font-size="11.5" fill="#4d5270">3 featured, 10 in preview, captions, filter tags</text></g></svg>