<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Signals in, three outputs out, every action logged" font-size="13" font-family="Inter Tight, system-ui, sans-serif"><defs><marker id="arch-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a93a8"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#141a33">Signals in, three outputs out, every action logged</text><g fill="none" stroke="#8a93a8" stroke-width="1.25"><path d="M224 106H252V190H280" marker-end="url(#arch-arrow2)"></path><path d="M224 194H280" marker-end="url(#arch-arrow2)"></path><path d="M224 282H252V190"></path><path d="M380 112V130" marker-end="url(#arch-arrow2)"></path><path d="M480 190H508V106H536" marker-end="url(#arch-arrow2)"></path><path d="M508 190V194H536" marker-end="url(#arch-arrow2)"></path><path d="M508 190V282H536" marker-end="url(#arch-arrow2)"></path><path d="M380 250V330" marker-end="url(#arch-arrow2)"></path></g><g><rect x="24" y="70" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="36" y="94" font-weight="600" fill="#141a33">Hourly events</text><text x="36" y="114" font-size="11.5" fill="#4d5270">Notifications: offers,</text><text x="36" y="130" font-size="11.5" fill="#4d5270">pricing health, sales</text></g><g><rect x="24" y="158" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="36" y="182" font-weight="600" fill="#141a33">Daily metrics</text><text x="36" y="202" font-size="11.5" fill="#4d5270">Data Kiosk: sales, traffic,</text><text x="36" y="218" font-size="11.5" fill="#4d5270">economics</text></g><g><rect x="24" y="246" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="36" y="270" font-weight="600" fill="#141a33">Weekly insight</text><text x="36" y="290" font-size="11.5" fill="#4d5270">Brand Analytics,</text><text x="36" y="306" font-size="11.5" fill="#4d5270">Customer Feedback</text></g><g><rect x="280" y="56" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="292" y="80" font-weight="600" fill="#141a33">Seller goal and rules</text><text x="292" y="98" font-size="11.5" fill="#4d5270">e.g. $3,000/mo, price floor</text></g><g><rect x="280" y="130" width="200" height="120" rx="8" fill="#b5401b" fill-opacity="0.12" stroke="#b5401b" stroke-width="2"></rect><text x="292" y="160" font-weight="600" fill="#141a33">Agent loop</text><text x="292" y="184" font-size="11.5" fill="#141a33">Reads every signal,</text><text x="292" y="200" font-size="11.5" fill="#141a33">checks goal and rules,</text><text x="292" y="216" font-size="11.5" fill="#141a33">then acts, asks or shows</text></g><g><rect x="536" y="70" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="548" y="94" font-weight="600" fill="#141a33">1 Does it</text><text x="548" y="114" font-size="11.5" fill="#4d5270">patchListingsItem,</text><text x="548" y="130" font-size="11.5" fill="#4d5270">after validation preview</text></g><g><rect x="536" y="158" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="548" y="182" font-weight="600" fill="#141a33">2 Asks you</text><text x="548" y="202" font-size="11.5" fill="#4d5270">Inbox: pick and reason,</text><text x="548" y="218" font-size="11.5" fill="#4d5270">approve or decline</text></g><g><rect x="536" y="246" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a93a8" stroke-width="1.25"></rect><text x="548" y="270" font-weight="600" fill="#141a33">3 Shows you</text><text x="548" y="290" font-size="11.5" fill="#4d5270">Blind-spot feed with</text><text x="548" y="306" font-size="11.5" fill="#4d5270">the fix and its value</text></g><g><rect x="24" y="330" width="712" height="44" rx="8" fill="#eef2f5" stroke="#8a93a8" stroke-width="1.25"></rect><text x="380" y="356" text-anchor="middle" fill="#141a33">Work log: trigger, API call and result for every action</text></g></svg>